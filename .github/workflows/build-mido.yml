name: Build mido Docker Droidspaces audio boot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  BOOT_SOURCE_URL: https://sourceforge.net/projects/kamisroms/files/Mido/Crdroid/A15/crDroidAndroid-15.0-20260531-mido-v11.16.zip/download
  BOOT_SOURCE_SHA256: E6DFF82977C04093379EB74FCBCD2891D0E6678CE4E54C13FDE2B773D6781CC3
  KERNEL_REPO: https://github.com/AlphaDroid-devices/kernel_xiaomi_mido.git
  KERNEL_REF: alpha-14
  RELEASE_TAG: mido-crdroid-15-20260531-docker-droidspaces-audio-boot
  RELEASE_BASE: mido-crDroidAndroid-15.0-20260531-docker-droidspaces-audio-boot
  MAGISK_LATEST_URL: https://github.com/topjohnwu/Magisk/releases/latest

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install boot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl file unzip

      - name: Download matching mido boot source
        run: |
          mkdir -p devices/mido/base
          tmp_source="$(mktemp)"
          curl -L --fail --retry 5 --retry-delay 5 -o "$tmp_source" "$BOOT_SOURCE_URL"
          printf '%s  %s\n' "$BOOT_SOURCE_SHA256" "$tmp_source" | sha256sum -c -
          if unzip -l "$tmp_source" boot.img >/dev/null 2>&1; then
            unzip -p "$tmp_source" boot.img > devices/mido/base/boot-current.img
          else
            cp -f "$tmp_source" devices/mido/base/boot-current.img
          fi
          file devices/mido/base/boot-current.img
          sha256sum devices/mido/base/boot-current.img

      - name: Build mido kernel
        run: |
          chmod +x devices/mido/scripts/build-mido-docker-kernel.sh
          devices/mido/scripts/build-mido-docker-kernel.sh

      - name: Repack boot
        run: |
          chmod +x scripts/repack-boot.sh
          scripts/repack-boot.sh \
            devices/mido/base/boot-current.img \
            devices/mido/artifacts/Image.gz-dtb \
            devices/mido/artifacts/boot-docker.img

      - name: Download latest official Magisk
        run: |
          latest_url="$(curl -Ls -o /dev/null -w '%{url_effective}' "$MAGISK_LATEST_URL")"
          magisk_version="${latest_url##*/}"
          magisk_apk_name="Magisk-${magisk_version}.apk"
          magisk_apk_url="https://github.com/topjohnwu/Magisk/releases/download/${magisk_version}/${magisk_apk_name}"
          {
            echo "MAGISK_VERSION=$magisk_version"
            echo "MAGISK_APK_NAME=$magisk_apk_name"
            echo "MAGISK_APK_URL=$magisk_apk_url"
          } > "$RUNNER_TEMP/magisk.env"
          cat "$RUNNER_TEMP/magisk.env" >> "$GITHUB_ENV"
          . "$RUNNER_TEMP/magisk.env"
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/$MAGISK_APK_NAME" "$MAGISK_APK_URL"
          sha256sum "$RUNNER_TEMP/$MAGISK_APK_NAME" > "$RUNNER_TEMP/$MAGISK_APK_NAME.sha256"

      - name: Patch boot with latest official Magisk
        run: |
          patch_dir="$RUNNER_TEMP/magisk-patch"
          mkdir -p "$patch_dir/host" "$patch_dir/target"
          cp -f devices/mido/artifacts/boot-docker.img "$patch_dir/boot.img"
          cp -f "$RUNNER_TEMP/$MAGISK_APK_NAME" "$patch_dir/magisk.apk"
          cd "$patch_dir"
          unzip -oj magisk.apk 'assets/boot_patch.sh' 'assets/util_functions.sh' 'assets/stub.apk'
          unzip -oj magisk.apk 'lib/x86_64/libmagiskboot.so' -d host
          unzip -oj magisk.apk \
            'lib/arm64-v8a/libmagisk.so' \
            'lib/arm64-v8a/libmagiskinit.so' \
            'lib/arm64-v8a/libinit-ld.so' \
            -d target
          cp -f host/libmagiskboot.so magiskboot
          cp -f target/libmagisk.so magisk
          cp -f target/libmagiskinit.so magiskinit
          cp -f target/libinit-ld.so init-ld
          chmod 755 boot_patch.sh magiskboot magisk magiskinit init-ld
          export BOOTMODE=false
          export OUTFD=1
          export SOURCEDMODE=true
          export API=35
          export ABI=arm64-v8a
          export ABI32=armeabi-v7a
          export ARCH=arm64
          export IS64BIT=true
          export KEEPVERITY=true
          export KEEPFORCEENCRYPT=true
          export PATCHVBMETAFLAG=false
          export RECOVERYMODE=false
          export LEGACYSAR=false
          . ./util_functions.sh
          . ./boot_patch.sh boot.img
          test -f new-boot.img
          cp -f new-boot.img "$GITHUB_WORKSPACE/devices/mido/artifacts/boot-docker-magisk.img"
          sha256sum "$GITHUB_WORKSPACE/devices/mido/artifacts/boot-docker-magisk.img" > "$GITHUB_WORKSPACE/devices/mido/artifacts/boot-docker-magisk.img.sha256"

      - name: Write release files
        run: |
          out=devices/mido/release
          mkdir -p "$out"
          cp -f devices/mido/artifacts/boot-docker.img "$out/$RELEASE_BASE.img"
          (cd "$out" && sha256sum "$RELEASE_BASE.img" > "$RELEASE_BASE.img.sha256")
          cp -f devices/mido/artifacts/boot-docker-magisk.img "$out/$RELEASE_BASE-magisk-$MAGISK_VERSION.img"
          (cd "$out" && sha256sum "$RELEASE_BASE-magisk-$MAGISK_VERSION.img" > "$RELEASE_BASE-magisk-$MAGISK_VERSION.img.sha256")
          cp -f devices/mido/artifacts/config-docker-final "$out/$RELEASE_BASE.config"
          cp -f "$RUNNER_TEMP/$MAGISK_APK_NAME" "$out/$MAGISK_APK_NAME"
          cp -f "$RUNNER_TEMP/$MAGISK_APK_NAME.sha256" "$out/$MAGISK_APK_NAME.sha256"
          {
            echo "device=mido"
            echo "rom=crDroidAndroid-15.0-20260531-mido-v11.16.zip"
            echo "boot_source_url=$BOOT_SOURCE_URL"
            echo "github_sha=$GITHUB_SHA"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "kernel_repo=$KERNEL_REPO"
            echo "kernel_ref=$KERNEL_REF"
            echo "upstream_commit=$(cat devices/mido/artifacts/upstream-commit)"
            echo "kernel_release=$(cat devices/mido/artifacts/kernel-release)"
            echo "boot_sha256=$(cut -d ' ' -f 1 devices/mido/artifacts/boot-docker.img.sha256)"
            echo "magisk_version=$MAGISK_VERSION"
            echo "magisk_apk=$MAGISK_APK_NAME"
            echo "magisk_apk_url=$MAGISK_APK_URL"
            echo "magisk_boot_sha256=$(cut -d ' ' -f 1 devices/mido/artifacts/boot-docker-magisk.img.sha256)"
          } > "$out/$RELEASE_BASE.manifest.env"
          {
            echo "mido Docker / Droidspaces / ALSA loopback boot image."
            echo
            echo "Kernel includes Docker / Droidspaces container support and CONFIG_SND_ALOOP=y."
            echo
            echo "This release contains both the plain boot image and a Magisk pre-patched boot image using official Magisk $MAGISK_VERSION."
            echo
            echo "ROM/vendor still must expose loopback capture through Audio HAL and audio policy as an input profile/device. Kernel-only loopback is not enough for WeChat / AudioRecord."
          } > "$out/RELEASE_NOTES.md"
          find "$out" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="mido crDroid 15 Docker Droidspaces audio boot"
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            "devices/mido/release/$RELEASE_BASE.img" \
            "devices/mido/release/$RELEASE_BASE.img.sha256" \
            "devices/mido/release/$RELEASE_BASE-magisk-$MAGISK_VERSION.img" \
            "devices/mido/release/$RELEASE_BASE-magisk-$MAGISK_VERSION.img.sha256" \
            "devices/mido/release/$RELEASE_BASE.config" \
            "devices/mido/release/$RELEASE_BASE.manifest.env" \
            "devices/mido/release/$MAGISK_APK_NAME" \
            "devices/mido/release/$MAGISK_APK_NAME.sha256" \
            --title "$title" \
            --notes-file devices/mido/release/RELEASE_NOTES.md \
            --latest
